name: "Welcome First-Time Contributor"

on:
  issues:
    types: [ opened ]
  pull_request_target:
    types: [ opened ]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
    - name: Welcome New Contributor
      uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "👋 Спасибо за создание Issue! Мы ценим ваш вклад в развитие Space Station 14 Launcher. Пожалуйста, убедитесь, что вы предоставили шаги для воспроизведения проблемы и приложили логи, если произошла ошибка."
        pr-message: "🚀 Добро пожаловать и спасибо за ваш Pull Request! Наша автоматическая система CI/CD проверит изменения и прогонит тесты. Мы скоро рассмотрим ваш код."
