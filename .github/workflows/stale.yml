name: "Close Stale Issues and PRs"

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: '⚠️ Эта тема не проявляла активности в течение 60 дней и помечена как устаревшая (`stale`). Она будет автоматически закрыта через 7 дней, если не появится новой активности.'
        stale-pr-message: '⚠️ Этот Pull Request не проявлял активности в течение 60 дней и помечен как устаревший (`stale`). Он будет автоматически закрыт через 7 дней, если не появится новой информации.'
        days-before-stale: 60
        days-before-close: 7
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,security,enhancement,bug'
        exempt-pr-labels: 'pinned,work-in-progress,wip'
