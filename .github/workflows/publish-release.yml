name: Publish Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: write

jobs:
  # Gate: run tests and validations before any release
  test:
    name: Pre-release Tests & Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Verify Formatting
      run: |
        dotnet restore
        dotnet format --verify-no-changes --no-restore

    - name: Run Full Test Suite
      run: dotnet test SS14.Launcher.Tests/SS14.Launcher.Tests.csproj -v normal --configuration Release

    - name: Validate AppStream Metadata
      run: |
        sudo apt-get update && sudo apt-get install -y appstream
        appstreamcli validate packaging/appstream/org.spacestation14.launcher.metainfo.xml --no-net

  # Build official bundles using publish.py and create release
  publish:
    name: Build Packages & Release
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Windows and Linux packages
      run: python3 publish.py windows linux

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          SS14.Launcher_Windows.zip
          SS14.Launcher_Linux.tar.gz
          SHA256SUMS.txt
          packaging/appstream/org.spacestation14.launcher.metainfo.xml
          packaging/flatpak/org.spacestation14.launcher.yml
