name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
         dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Install dependencies
      run: dotnet restore

    - name: Build (Debug)
      run: dotnet build --configuration Debug --no-restore

    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore

    - name: Verify Code Formatting
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format --verify-no-changes --no-restore

    - name: Run Tests (with Code Coverage on Linux)
      run: dotnet test SS14.Launcher.Tests/SS14.Launcher.Tests.csproj --no-build --configuration Debug -v normal --collect:"XPlat Code Coverage"

    - name: Run Tests (Release)
      run: dotnet test SS14.Launcher.Tests/SS14.Launcher.Tests.csproj --no-build --configuration Release -v normal

    - name: Upload Code Coverage Report
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: '**/coverage.cobertura.xml'
        retention-days: 14

    - name: Validate AppStream Metadata (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update && sudo apt-get install -y appstream
        appstreamcli validate packaging/appstream/org.spacestation14.launcher.metainfo.xml --no-net

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: '**/TestResults/**'
        retention-days: 7
