name: Code Quality & Static Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-analyze:
    name: Code Style & Quality Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Verify Formatting (dotnet format)
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Build with Warnings As Errors
      run: dotnet build -c Release -warnaserror:CS4014

    - name: Run Test Suite with Coverage
      run: dotnet test SS14.Launcher.Tests/SS14.Launcher.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

    - name: Validate AppStream Metadata
      run: |
        sudo apt-get update && sudo apt-get install -y appstream
        appstreamcli validate packaging/appstream/org.spacestation14.launcher.metainfo.xml --no-net
