app-id: org.spacestation14.launcher
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: SS14.Launcher

finish-args:
  # Display servers: X11 & Wayland
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  # Network access for hub API, game downloads, server connections
  - --share=network
  # Audio: PulseAudio & PipeWire
  - --socket=pulseaudio
  # Hardware accelerated graphics
  - --device=dri
  # Notifications
  - --talk-name=org.freedesktop.Notifications
  # Secret Service for secure token storage
  - --talk-name=org.freedesktop.secrets
  # Persistent data storage
  - --filesystem=xdg-data/Space Station 14:create
  # File chooser portals
  - --filesystem=xdg-run/dconf
  - --talk-name=ca.desrt.dconf
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf

build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'

modules:
  - name: libsodium
    buildsystem: autotools
    sources:
      - type: archive
        url: https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-RELEASE.tar.gz
        sha256: ebb65ed60dbd66d0e2741ade891e577c8b9291b8b025eb3a712b3068e7584937

  - name: ss14-launcher
    buildsystem: simple
    build-commands:
      # Build and publish launcher and loader
      - dotnet publish SS14.Launcher/SS14.Launcher.csproj -c Release -r linux-x64 --no-self-contained -o /app/bin
      - dotnet publish SS14.Loader/SS14.Loader.csproj -c Release -r linux-x64 --no-self-contained -o /app/bin/loader
      # Launcher startup wrapper
      - install -Dm755 PublishFiles/SS14.Launcher /app/bin/SS14.Launcher
      # Desktop shortcut & icon
      - install -Dm644 PublishFiles/SS14.desktop /app/share/applications/org.spacestation14.launcher.desktop
      - install -Dm644 PublishFiles/SS14.png /app/share/icons/hicolor/256x256/apps/org.spacestation14.launcher.png
      # AppStream metadata
      - install -Dm644 packaging/appstream/org.spacestation14.launcher.metainfo.xml /app/share/metainfo/org.spacestation14.launcher.metainfo.xml
    sources:
      - type: git
        url: https://github.com/MeiDoto/SS14.Launcher.git
        branch: master
